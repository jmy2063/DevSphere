name: DevSphere AX Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Core deterministic regression
        run: bash ./verify-core.sh

      - name: Synthetic impact benchmark and evaluation regression
        run: bash ./verify-benchmark.sh

      - name: Pinned public Spring source checks
        run: bash ./verify-public-benchmark.sh

      - name: Semantic source checks
        run: bash ./verify-semantic.sh

      - name: Backend tests and bootJar
        working-directory: backend
        run: bash ./gradlew clean test bootJar --no-daemon

      - name: Frontend strict typecheck and build
        working-directory: frontend
        run: npm run build

      - name: PR URL validation
        run: node tools/frontend-unit.cjs

      - name: Standalone smoke report
        run: bash ./report-demo.sh

      - name: Verify report artifact
        run: test -s demo-output/DevSphere_AX_Report.html
